# Standalone target access: no changes to Keil, drivers or installed packs.
adapter driver cmsis-dap
if {![info exists DAP_BACKEND]} { set DAP_BACKEND usb_bulk }
cmsis-dap backend $DAP_BACKEND
adapter usb vid_pid 0x303a 0x4041
transport select swd
adapter speed 2000
source [find target/swj-dp.tcl]
swj_newdap chip cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create chip.dap -chain-position chip.cpu
target create chip.cpu cortex_m -dap chip.dap
reset_config srst_only srst_nogate
# Read/debug only. This target reports Cortex-M4 plus DEV_ID 0x410;
# OpenOCD's stm32f1x autodetection chooses the wrong size-register address.
# Flash programming was verified using Keil's STM32F10x_128.FLM instead.
gdb port disabled
tcl port disabled
telnet port disabled
